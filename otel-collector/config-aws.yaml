# ============================================================
# OTel Collector — Configuracion AWS (ECS Fargate)
# ============================================================
# Receivers:  OTLP gRPC (4317) + HTTP (4318)
# Processors: memory_limiter → resource (cloud.provider=aws) → batch
# Exporters:
#   trazas   → AWS X-Ray
#   metricas → Prometheus scrape endpoint + Amazon CloudWatch
#   logs     → Amazon CloudWatch Logs
#
# Variables de entorno requeridas:
#   AWS_REGION — region de AWS destino
# ============================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: cloud.provider
        value: "aws"
        action: upsert
      - key: deployment.environment
        value: "production"
        action: upsert
      - key: cloud.region
        value: ${env:AWS_REGION}
        action: upsert

  batch:
    timeout: 10s
    send_batch_size: 2048
    send_batch_max_size: 4096

exporters:
  # ── Trazas → AWS X-Ray ────────────────────────────────────────
  awsxray:
    region: ${env:AWS_REGION}
    no_verify_ssl: false
    local_mode: false
    index_all_attributes: true

  # ── Metricas → Prometheus scrape endpoint ─────────────────────
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true

  # ── Metricas → CloudWatch ─────────────────────────────────────
  awscloudwatch:
    region: ${env:AWS_REGION}
    namespace: "OTelLab/Microservices"
    log_group_name: "/otel/metrics"
    dimension_rollup_option: NoDimensionRollup
    metric_declarations:
      - dimensions: [[service.name]]
        metric_name_selectors:
          - "^http_server_.*"
          - "^orders_.*"
          - "^items_.*"

  # ── Logs → CloudWatch Logs ─────────────────────────────────────
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: "/otel/services"
    log_stream_name: "otel-collector-${env:AWS_REGION}"
    raw_log: false

service:
  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awsxray]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, awscloudwatch]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs]
