# Configuracion de observabilidad L7 del mesh (Istio Telemetry API):
#   - Trazas: 100% sampling en los proxies Envoy, generando spans L7
#     (istio-proxy) que envuelven a los spans de aplicacion emitidos por
#     el SDK de OTel, mostrando en Jaeger el salto de red completo
#     (cliente -> sidecar -> sidecar -> servidor).
#   - Access logs: formato estructurado JSON en stdout de cada sidecar,
#     con metricas RED (request/error/duration) a nivel de proxy, no solo
#     de aplicacion.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: otel-collector
      randomSamplingPercentage: 100.0
  accessLogging:
    - providers:
        - name: envoy
