# Configuracion de observabilidad L7 del mesh (Istio Telemetry API):
#   - Trazas: 100% sampling en los proxies Envoy mediante el proveedor
#     Stackdriver gestionado por Cloud Service Mesh, con visibilidad L7 en
#     Cloud Trace para cada salto entre workloads.
#   - Access logs: formato estructurado JSON en stdout de cada sidecar,
#     con metricas RED (request/error/duration) a nivel de proxy, no solo
#     de aplicacion.
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
      - name: stackdriver
      randomSamplingPercentage: 100.0
  accessLogging:
    - providers:
        - name: envoy
