# ==============================================================================
# Docker Compose — Entorno local completo para demostracion y captura evidencias
# ==============================================================================
#
# Servicios incluidos:
#   - postgres       : Base de datos PostgreSQL compartida
#   - service-b      : Microservicio B (catalogo de items)
#   - service-a      : Microservicio A (orquestador de ordenes)
#   - otel-collector : OpenTelemetry Collector (OTLP → Jaeger / Prometheus)
#   - jaeger         : Backend de trazas + UI en http://localhost:16686
#   - prometheus     : Backend de metricas en http://localhost:9090
#   - grafana        : Visualizacion en http://localhost:3000 (admin/admin)
#
# Comandos rapidos:
#   docker compose up -d --build        # Levantar todo
#   docker compose logs -f service-a    # Ver logs de service-a
#   docker compose down -v              # Detener y borrar volumenes
# ==============================================================================

services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: otel-postgres
    environment:
      POSTGRES_DB: labdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d labdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - otel-net

  # ── Service B (debe arrancar antes que Service A) ─────────────────────────
  service-b:
    build:
      context: ./services/service-b
      dockerfile: Dockerfile
    container_name: otel-service-b
    environment:
      OTEL_SERVICE_NAME: service-b
      OTEL_SERVICE_VERSION: 1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/labdb
      DEPLOYMENT_ENV: local
      CLOUD_PROVIDER: local
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - otel-net
    restart: unless-stopped

  # ── Service A ────────────────────────────────────────────────────────────────
  service-a:
    build:
      context: ./services/service-a
      dockerfile: Dockerfile
    container_name: otel-service-a
    environment:
      OTEL_SERVICE_NAME: service-a
      OTEL_SERVICE_VERSION: 1.0.0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SDK_DISABLED: "false"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/labdb
      SERVICE_B_URL: http://service-b:8001
      DEPLOYMENT_ENV: local
      CLOUD_PROVIDER: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      service-b:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - otel-net
    restart: unless-stopped

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector/config-local.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Metricas internas del Collector
      - "8889:8889"    # Prometheus scrape endpoint (metricas de servicios)
    depends_on:
      - jaeger
    networks:
      - otel-net
    restart: unless-stopped

  # ── Jaeger — Backend de trazas ────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: otel-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317"         # OTLP gRPC (interno, usado por el Collector)
      - "14250:14250"  # gRPC Model
    networks:
      - otel-net
    restart: unless-stopped

  # ── Prometheus — Backend de metricas ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: otel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    networks:
      - otel-net
    restart: unless-stopped

  # ── Grafana — Visualizacion ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: otel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
    networks:
      - otel-net
    restart: unless-stopped

# ── Volumenes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

# ── Red interna ────────────────────────────────────────────────────────────────
networks:
  otel-net:
    driver: bridge
    name: otel-lab-network
