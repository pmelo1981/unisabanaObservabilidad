global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Metricas exportadas por los microservicios (via OTel Collector) ────────
  - job_name: "otel-services"
    static_configs:
      - targets: ["otel-collector:8889"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: scrape_source
        replacement: "otel-collector"

  # ── Metricas internas del OTel Collector (caidas, latencia, batch size) ────
  - job_name: "otel-collector-internal"
    static_configs:
      - targets: ["otel-collector:8888"]

  # ── Metricas de Jaeger ─────────────────────────────────────────────────────
  - job_name: "jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
