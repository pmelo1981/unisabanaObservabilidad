apiVersion: 1

providers:
  - name: "OTel Lab Dashboards"
    orgId: 1
    folder: "OTel Lab"
    folderUid: "otel-lab"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
