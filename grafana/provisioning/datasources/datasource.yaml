apiVersion: 1

datasources:
  # ── Prometheus (metricas) ───────────────────────────────────────────────────
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: false
    version: 1
    editable: false

  # ── Jaeger (trazas) ─────────────────────────────────────────────────────────
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      tracesToLogsV2:
        # Correlacion trazas → logs usando trace_id como pivot
        datasourceUid: ""
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: "service.name"
            value: "service_name"
      nodeGraph:
        enabled: true
      search:
        hide: false
    version: 1
    editable: false
