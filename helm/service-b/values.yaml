# Helm values para service-b
replicaCount: 2

image:
  repository: "us-central1-docker.pkg.dev/project-546ee9f1-20e7-4368-919/otel-lab/service-b"
  pullPolicy: Always
  tag: "chaos-instance-v2"

service:
  type: ClusterIP
  port: 8001
  targetPort: 8001

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

env:
  OTEL_SERVICE_NAME: "service-b"
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SDK_DISABLED: "false"
  DEPLOYMENT_ENV: "production"
  CLOUD_PROVIDER: "gcp"

databaseSecretName: "service-b-db-secret"
databaseSecretKey: "DATABASE_URL"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 8001
  initialDelaySeconds: 10
  periodSeconds: 10

podAnnotations:
  prometheus.io/scrape: "false"

serviceAccount:
  create: true
  name: "service-b-sa"
