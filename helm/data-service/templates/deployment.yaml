apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-service.fullname" . }}
  labels:
    {{- include "data-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "data-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app.kubernetes.io/name: {{ include "data-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: CLOUD_SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: data-service-db-credentials
                  key: cloud_sql_dsn
            - name: AWS_RDS_DSN
              valueFrom:
                secretKeyRef:
                  name: data-service-db-credentials
                  key: aws_rds_dsn
            - name: OTEL_SERVICE_NAME
              value: "data-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.otlp.endpoint | default "otel-collector:4317" }}"
            - name: DEPLOYMENT_ENV
              value: {{ .Values.deploymentEnv | default "production" | quote }}
            - name: CLOUD_PROVIDER
              value: "gcp"
            - name: CHAOS_CONTROL_ENABLED
              value: {{ .Values.chaosControl.enabled | default false | quote }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
