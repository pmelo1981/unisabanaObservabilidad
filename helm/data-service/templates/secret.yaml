apiVersion: v1
kind: Secret
metadata:
  name: data-service-db-credentials
  labels:
    app.kubernetes.io/name: {{ include "data-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  cloud_sql_dsn: {{ .Values.db.cloudSqlDsn | quote }}
  aws_rds_dsn: {{ .Values.db.awsRdsDsn | default (printf "postgresql://%s:%s@rds-sim.%s.svc.cluster.local:5432/%s" .Values.rdsSim.user .Values.rdsSim.password .Release.Namespace .Values.rdsSim.database) | quote }}
