{{- if .Values.rdsSim.enabled }}
# ==============================================================================
# Simulacion de AWS RDS dentro del cluster GKE.
#
# Este despliegue es exclusivamente GCP (no hay cuenta AWS activa). Para
# demostrar la arquitectura multi-cloud pedida (data-service accede a GCP
# Cloud SQL Y a AWS RDS) sin incurrir en costo/credenciales de AWS reales,
# este Postgres hace las veces de "AWS RDS": data-service se conecta a el
# via AWS_RDS_DSN exactamente igual que lo haria contra una instancia RDS
# real (el driver y la instrumentacion OTel no distinguen el backend). Si en
# el futuro se dispone de una cuenta AWS, basta con apuntar el secret
# aws_rds_dsn a la instancia RDS real y eliminar este Deployment.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rds-sim
  labels:
    app.kubernetes.io/name: rds-sim
    app.kubernetes.io/part-of: data-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-sim
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          env:
            - name: POSTGRES_DB
              value: {{ .Values.rdsSim.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.rdsSim.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.rdsSim.password | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.rdsSim.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          {{- if .Values.rdsSim.persistence.enabled }}
          persistentVolumeClaim:
            claimName: rds-sim-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: rds-sim
  labels:
    app.kubernetes.io/name: rds-sim
    app.kubernetes.io/part-of: data-service
spec:
  selector:
    app.kubernetes.io/name: rds-sim
  ports:
    - port: 5432
      targetPort: 5432
{{- if .Values.rdsSim.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rds-sim-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.rdsSim.persistence.size }}
{{- end }}
{{- end }}
