apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      resource:
        attributes:
          - key: cloud.provider
            value: "gcp"
            action: upsert
          - key: deployment.environment
            value: "production"
            action: upsert
      batch:
        timeout: 10s
        send_batch_size: 2048

    exporters:
      otlp/jaeger:
        endpoint: otel-stack-jaeger-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        resource_to_telemetry_conversion:
          enabled: true
      {{- if .Values.collector.googleCloud.enabled }}
      googlecloud:
        project: ${GCP_PROJECT_ID}
      {{- else }}
      debug:
        verbosity: basic
      {{- end }}

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/jaeger]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:
            - prometheus
            {{- if .Values.collector.googleCloud.enabled }}
            - googlecloud
            {{- end }}
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters:
            {{- if .Values.collector.googleCloud.enabled }}
            - googlecloud
            {{- else }}
            - debug
            {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  replicas: {{ .Values.collector.replicaCount }}
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8888
              name: metrics-int
            - containerPort: 8889
              name: metrics-svc
          env:
            - name: GCP_PROJECT_ID
              value: {{ .Values.collector.env.GCP_PROJECT_ID | quote }}
            - name: GCP_REGION
              value: {{ .Values.collector.env.GCP_REGION | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics-int
      port: 8888
      targetPort: 8888
    - name: metrics-svc
      port: 8889
      targetPort: 8889
