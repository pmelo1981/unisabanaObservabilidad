# Values para el OTel Stack en GKE
# Instalar: helm dependency update ./helm/otel-stack && helm upgrade --install otel-stack ./helm/otel-stack -n observability

# ── OTel Collector ────────────────────────────────────────────────────────────
collector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  
  replicaCount: 1

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  # Configmap con la configuracion del Collector (config-gcp.yaml)
  configMapName: "otel-collector-config"

  env:
    GCP_PROJECT_ID: "project-546ee9f1-20e7-4368-919"
    GCP_REGION: "us-central1"

  googleCloud:
    enabled: true

# ── Jaeger ─────────────────────────────────────────────────────────────────────
jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false
    elasticsearch: false
    kafka: false
  allInOne:
    enabled: true
    image:
      tag: "1.60"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  storage:
    type: memory
  agent:
    enabled: false
  collector:
    enabled: false
  query:
    enabled: false

# ── Prometheus ─────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: actividad-3-3-modulo-d
          interval: 15s
          rules:
            - alert: ChaosD1ServiceBLatencyDetected
              expr: >-
                histogram_quantile(0.99,
                sum by (le)
                (rate(order_processing_duration_milliseconds_bucket[1m]))) > 200
              for: 30s
              labels:
                severity: warning
                service: service-b
                experiment: d1
              annotations:
                summary: "D1: aumento de latencia hacia service-b"
                description: "El p99 superó 200 ms; el baseline local medido fue 73,58 ms."
                runbook_url: "docs/runbooks/d1-service-b-latency.md"
            - alert: ChaosD2DataServiceErrorRateDetected
              expr: >-
                (sum(rate(istio_requests_total{destination_service_name="data-service",
                destination_service_namespace="data-service",
                reporter="destination",
                response_code=~"5.."}[1m]))
                / clamp_min(sum(rate(istio_requests_total{
                destination_service_name="data-service",
                destination_service_namespace="data-service",
                reporter="destination"}[1m])), 0.001)) > 0.05
              for: 30s
              labels:
                severity: critical
                service: data-service
                experiment: d2
              annotations:
                summary: "D2: error rate alto en data-service"
                description: "Más del 5 % del tráfico a data-service terminó en 5xx."
                runbook_url: "docs/runbooks/d2-data-service-errors.md"
  server:
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      scrape_timeout: 4s
    retention: "7d"
    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
  alertmanager:
    enabled: false
  pushgateway:
    enabled: false
  nodeExporter:
    enabled: true
  extraScrapeConfigs: |
    - job_name: 'otel-collector'
      static_configs:
        - targets: ['otel-collector.observability.svc.cluster.local:8889']
    - job_name: 'otel-collector-internal'
      static_configs:
        - targets: ['otel-collector.observability.svc.cluster.local:8888']
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: service_b_chaos_alerts
          interval: 5s
          rules:
            - alert: ServiceBLatencySLOViolation
              expr: >-
                histogram_quantile(0.99,
                  sum(rate(item_enrichment_duration_milliseconds_bucket{service_name="service-b"}[30s])) by (le)
                ) > 200
              for: 5s
              labels:
                severity: critical
                service: service-b
                experiment: chaos-latency-200ms
              annotations:
                summary: "service-b p99 exceeds the 200 ms SLO"
                description: "The service-b p99 enrichment latency has exceeded 200 ms for more than 5 seconds."
            - alert: SuspiciousAuthenticationFailures
              expr: >-
                sum(increase(security_authentication_attempts_total{outcome="rejected"}[1m])) > 3
              for: 1m
              labels:
                severity: warning
                service: data-service
                signal: authentication
              annotations:
                summary: "Repeated rejected authentication attempts"
                description: "data-service observed more than three rejected API-key attempts per minute."
            - alert: UnexpectedEastWestTrafficBurst
              expr: >-
                sum(rate(security_network_requests_total{traffic_direction="east_west"}[1m])) > 0.5
              for: 1m
              labels:
                severity: warning
                service: data-service
                signal: network
              annotations:
                summary: "Unexpected east-west traffic burst"
                description: "data-service received more than 30 east-west requests per minute for one minute."

# ── Grafana ────────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: LoadBalancer
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://otel-stack-prometheus-server.observability.svc.cluster.local
          isDefault: true
        - name: Jaeger
          type: jaeger
          url: http://otel-stack-jaeger-query.observability.svc.cluster.local:16686
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "otel-lab"
          folder: "OTel Lab"
          type: file
          options:
            path: /var/lib/grafana/dashboards/otel-lab
  dashboardsConfigMaps:
    otel-lab: "grafana-dashboards"
    security-observability: "security-observability-dashboard"
