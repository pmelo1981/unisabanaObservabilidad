# ==============================================================================
# Modulo C — Politica de autorizacion zero-trust del mesh (MODO DRY-RUN)
# ==============================================================================
# Version SEGURA de mesh/authorization-policy.yaml. Identica en reglas, pero
# con la anotacion istio.io/dry-run="true" en cada politica.
#
# En modo dry-run Envoy EVALUA la politica y registra que habria hecho, pero
# NO bloquea ni una sola peticion. Es imposible que este archivo tumbe el
# sistema.
#
# ORDEN DE DESPLIEGUE OBLIGATORIO
#
#   1. kubectl apply -f mesh/authorization-policy-dryrun.yaml
#
#   2. Generar trafico normal durante 5-10 minutos y comprobar que NINGUNA
#      peticion legitima aparece como denegada en la sombra:
#
#      kubectl logs -n services -l app=service-a -c istio-proxy \
#        | grep -i shadow_denied
#
#      # o, con mas detalle, las estadisticas de RBAC en sombra del sidecar:
#      kubectl exec -n services deploy/service-a -c istio-proxy -- \
#        pilot-agent request GET stats | grep rbac
#
#      Si aparece trafico legitimo denegado, la matriz de comunicacion esta
#      incompleta: corrige los puertos/labels ANTES de continuar.
#
#   3. Solo entonces:
#      kubectl delete -f mesh/authorization-policy-dryrun.yaml
#      kubectl apply  -f mesh/authorization-policy.yaml
#
# Por que este paso no es opcional: una AuthorizationPolicy con 'spec: {}'
# deniega todo el namespace. Si un selector o un puerto no coincide con la
# realidad del despliegue, el resultado no es una alerta sino una caida total.
# El dry-run convierte ese riesgo en una comprobacion de 10 minutos.
#
# NOTA sobre la senal: en dry-run los rechazos NO producen 403 en el access
# log, sino contadores 'shadow_denied'. La metrica security/failed_auth_workload
# solo empieza a tener datos cuando se pasa al modo aplicacion del paso 3.
# ==============================================================================

# ── 1. Denegacion por defecto en el namespace 'services' ─────────────────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all-services
  namespace: services
  annotations:
    "istio.io/dry-run": "true"
spec: {}
---
# ── 3. Entrada Norte-Sur: Internet -> service-a :8000 ────────────────────────
# service-a es el unico servicio expuesto por LoadBalancer. El trafico llega
# desde IPs de Google Cloud sin identidad SPIFFE, por lo que la regla no puede
# exigir 'principals': se autoriza por destino (workload + puerto), que es lo
# correcto para un punto de entrada publico.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-service-a
  namespace: services
  annotations:
    "istio.io/dry-run": "true"
spec:
  selector:
    matchLabels:
      app: service-a
  action: ALLOW
  rules:
    - to:
        - operation:
            ports: ["8000"]
---
# ── 4. Este-Oeste: service-a -> service-b :8001 ──────────────────────────────
# 'principals' usa la identidad SPIFFE derivada del ServiceAccount, verificada
# criptograficamente por mTLS. No es un filtro por IP: un pod que robe la IP de
# service-a sigue sin poder presentar su certificado.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-service-a-to-service-b
  namespace: services
  annotations:
    "istio.io/dry-run": "true"
spec:
  selector:
    matchLabels:
      app: service-b
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/services/sa/service-a-sa"
      to:
        - operation:
            ports: ["8001"]
---
# ── 5. Este-Oeste: service-a / service-b -> data-service :8080 ───────────────
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-services-to-data-service
  namespace: services
  annotations:
    "istio.io/dry-run": "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: data-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/services/sa/service-a-sa"
              - "cluster.local/ns/services/sa/service-b-sa"
      to:
        - operation:
            ports: ["8080"]
---
# ── 6. Acceso a la base de datos simulada 'rds-sim' :5432 ────────────────────
# Solo data-service puede hablar con PostgreSQL. Si service-a o service-b
# intentaran ir directo a la base de datos saltandose la capa de datos (un
# antipatron habitual), quedaria registrado como RBAC_ACCESS_DENIED.
#
# En el despliegue real data-service vive en el namespace 'services', junto a
# service-a y service-b, asi que autorizar "todo el namespace" no restringiria
# nada. Se autoriza por la identidad concreta de data-service, que al no
# definir serviceAccountName es la SA 'default' de ese namespace.
#
# Efecto colateral util: cualquier pod nuevo que se despliegue en 'services'
# sin SA propia heredaria esa identidad y podria hablar con la base de datos.
# Darle una SA propia a data-service (una linea en su chart) cerraria ese
# hueco, pero eso es un cambio al Modulo A y queda como recomendacion.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-data-service-to-db
  namespace: services
  annotations:
    "istio.io/dry-run": "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rds-sim
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/services/sa/default"
      to:
        - operation:
            ports: ["5432"]
