apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: chaos-d1-service-b-latency
  namespace: services
  labels:
    app.kubernetes.io/part-of: actividad-3-3-modulo-d
    observabilidad.unisabana.edu/experiment: d1-service-b-latency
spec:
  hosts:
    - service-b.services.svc.cluster.local
  http:
    # Health checks quedan explícitamente fuera del fallo.
    - name: health-without-fault
      match:
        - uri:
            exact: /health
      route:
        - destination:
            host: service-b.services.svc.cluster.local
            port:
              number: 8001
    - name: business-traffic-with-200ms-delay
      match:
        - uri:
            prefix: /items
      fault:
        delay:
          fixedDelay: 200ms
          percentage:
            value: 100.0
      route:
        - destination:
            host: service-b.services.svc.cluster.local
            port:
              number: 8001
